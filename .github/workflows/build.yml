name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            arch: ''
          - os: windows-latest
            name: windows
            arch: ''
          # Qt 6.8.1 macOS binaries are universal and published only under the
          # `clang_64` arch (no separate clang_arm64). Build both slices from it.
          - os: macos-latest
            name: macos-arm64
            arch: clang_64
            cmake_arch: arm64
          - os: macos-15-intel
            name: macos-x86_64
            arch: clang_64
            cmake_arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.1'
          modules: 'qtserialport'
          arch: ${{ matrix.arch }}
          cache: true

      # Qt 6.8.1's FindWrapOpenGL.cmake falls back to the AGL framework, which
      # was removed in newer macOS. Drop that fallback (this app doesn't use it).
      - name: Patch Qt (remove AGL fallback)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sed -i '' -e '/-framework AGL/d' -e '/__opengl_agl_fw_path}/d' \
            "$QT_ROOT_DIR/lib/cmake/Qt6/FindWrapOpenGL.cmake"

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build --config Release --parallel

      # ---- Packaging ----
      - name: Package Windows (portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: windeployqt --release build/Release/comm-sampling.exe

      - name: Package macOS (dmg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          macdeployqt build/comm-sampling.app -dmg
          mv build/comm-sampling.dmg comm-sampling-${{ matrix.name }}.dmg

      - name: Package Linux (AppImage)
        if: runner.os == 'Linux'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          wget -q -O linuxdeploy-x86_64.AppImage "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q -O linuxdeploy-plugin-qt.AppImage "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt.AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT=comm-sampling-linux-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/comm-sampling \
            -d packaging/comm-sampling.desktop --plugin qt --output appimage

      # ---- Upload ----
      - name: Upload (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: comm-sampling-windows-x64
          path: build/Release/**

      - name: Upload (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: comm-sampling-${{ matrix.name }}
          path: comm-sampling-${{ matrix.name }}.dmg

      - name: Upload (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: comm-sampling-linux
          path: comm-sampling-linux-x86_64.AppImage

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Repackage Windows zip
        run: |
          cd artifacts/comm-sampling-windows-x64
          zip -r ../../comm-sampling-windows-x64.zip .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            comm-sampling-windows-x64.zip
            artifacts/comm-sampling-macos-arm64/*.dmg
            artifacts/comm-sampling-macos-x86_64/*.dmg
            artifacts/comm-sampling-linux/*.AppImage
